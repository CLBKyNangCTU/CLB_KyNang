<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ thống Quản lý CLB</title>
  <link id="favicon" rel="icon" type="image/jpeg" href="CLB.jpg">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b192c; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
  <script>
    window.addEventListener('load', function() {
      const img = new Image();
      img.onload = function() {
        // Cắt sát vào đúng vòng tròn viền ngoài của ảnh CLB.jpg (bỏ lề trắng 4 cạnh)
        const trimRatio = 0.032; 
        const cropSize = Math.min(img.width, img.height) * (1 - trimRatio * 2);
        const startX = (img.width - cropSize) / 2;
        const startY = (img.height - cropSize) / 2;

        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');

        // Tạo mặt nạ hình tròn khít viền
        ctx.beginPath();
        ctx.arc(128, 128, 128, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();

        // Vẽ phần logo đã cắt sát viền vào khung tròn
        ctx.drawImage(img, startX, startY, cropSize, cropSize, 0, 0, 256, 256);
        const fav = document.getElementById('favicon');
        fav.type = 'image/png';
        fav.href = canvas.toDataURL('image/png');
      };
      img.src = 'CLB.jpg';
    });
  </script>
</head>
<body>
  <iframe id="appFrame" src="" allow="geolocation *"></iframe>

  <script>
    const APPS_SCRIPT_BASE_URL = "https://script.google.com/macros/s/AKfycbyaU0sTJFvmGNS0dsRed0OJylbHLt1-ZGhC6Pj21oHRR0YueSVi0bzm3KE6kEkXg1MYBQ/exec";
    const queryParams = window.location.search;
    document.getElementById("appFrame").src = APPS_SCRIPT_BASE_URL + queryParams;
  </script>
</body>
</html>
